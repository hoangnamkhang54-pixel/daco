<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Người que AR</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: system-ui, sans-serif; }
  video { display: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  #ui { position: fixed; top: 10px; left: 10px; display: flex; gap: 8px; align-items: center; z-index: 5; }
  button { padding: 8px 14px; border: 0; border-radius: 8px; background: #ffffffdd; font-size: 14px; }
  #status { color: #fff; font-size: 14px; text-shadow: 0 0 4px #000; }
</style>
</head>
<body>
<video id="video" playsinline muted></video>
<canvas id="canvas"></canvas>
<div id="ui">
  <button id="toggleBg">Ẩn camera</button>
  <span id="status">Đang tải mô hình...</span>
</div>

<script type="module">
import { PoseLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("status");
const MAX_PEOPLE = 30; // tăng/giảm tùy sức máy
// Màu tự sinh, không giới hạn số người
const color = (i) => `hsl(${(i * 137.5) % 360} 100% 60%)`;
let showCam = true;
const smooth = []; // làm mượt theo từng người

document.getElementById("toggleBg").onclick = (e) => {
  showCam = !showCam;
  e.target.textContent = showCam ? "Ẩn camera" : "Hiện camera";
};

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

let landmarker;
async function init() {
  const fileset = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  landmarker = await PoseLandmarker.createFromOptions(fileset, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
      delegate: "GPU"
    },
    runningMode: "VIDEO",
    numPoses: MAX_PEOPLE
  });
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "user", width: 1280, height: 720 }, audio: false
  });
  video.srcObject = stream;
  await video.play();
  statusEl.textContent = "Đứng vào khung hình nhé!";
  requestAnimationFrame(loop);
}

// Tính vùng hiển thị video kiểu "cover" để người que khớp với hình
function coverRect() {
  const vw = video.videoWidth, vh = video.videoHeight;
  const s = Math.max(canvas.width / vw, canvas.height / vh);
  const w = vw * s, h = vh * s;
  return { x: (canvas.width - w) / 2, y: (canvas.height - h) / 2, w, h };
}

function toScreen(lm, r) {
  // lật ngược trục X như gương
  return { x: r.x + (1 - lm.x) * r.w, y: r.y + lm.y * r.h };
}

function lerpPt(prev, cur, a = 0.5) {
  return prev ? { x: prev.x + (cur.x - prev.x) * a, y: prev.y + (cur.y - prev.y) * a } : cur;
}

function drawStick(P, color) {
  const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

  const neck = mid(P[11], P[12]);
  const hip = mid(P[23], P[24]);
  const shoulderW = dist(P[11], P[12]);
  const headR = Math.max(18, shoulderW * 0.45);
  const head = { x: P[0].x, y: P[0].y - headR * 0.15 };

  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.lineWidth = Math.max(4, shoulderW * 0.12);
  ctx.shadowColor = color;
  ctx.shadowBlur = smooth.length > 8 ? 0 : 12; // nhiều người thì tắt bóng cho nhẹ

  const line = (...pts) => {
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();
  };

  // đầu
  ctx.beginPath();
  ctx.arc(head.x, head.y, headR, 0, Math.PI * 2);
  ctx.stroke();
  // cổ + thân
  line({ x: head.x, y: head.y + headR }, neck);
  line(neck, hip);
  // vai & hông
  line(P[11], P[12]);
  line(P[23], P[24]);
  // tay
  line(P[11], P[13], P[15]);
  line(P[12], P[14], P[16]);
  // chân
  line(P[23], P[25], P[27]);
  line(P[24], P[26], P[28]);
  ctx.shadowBlur = 0;
}

let lastT = -1;
function loop() {
  requestAnimationFrame(loop);
  if (video.readyState < 2) return;
  const r = coverRect();

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (showCam) {
    ctx.save();
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
    // vẽ video đã lật gương
    ctx.drawImage(video, canvas.width - (r.x + r.w), r.y, r.w, r.h);
    ctx.restore();
  } else {
    ctx.fillStyle = "#0a0a14";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  const now = performance.now();
  if (now === lastT) return;
  lastT = now;
  const res = landmarker.detectForVideo(video, now);

  const people = res.landmarks || [];
  statusEl.textContent = `Đang thấy ${people.length} người`;
  people.forEach((lms, i) => {
    const pts = lms.map((lm) => toScreen(lm, r));
    smooth[i] = pts.map((p, k) => lerpPt(smooth[i] && smooth[i][k], p, 0.55));
    drawStick(smooth[i], color(i));
  });
  smooth.length = people.length;
}

init().catch((err) => {
  statusEl.textContent = "Lỗi: " + err.message + " (cần cho phép camera và chạy qua https)";
  console.error(err);
});
</script>
</body>
</html>
